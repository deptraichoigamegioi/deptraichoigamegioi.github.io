<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trang cá nhân của Văn Thắng. Chào mừng bạn ghé thăm!">
  <meta name="theme-color" content="#10151d">
  <title>Văn Thắng | Trang cá nhân</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310151d'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-size='28' font-weight='bold' fill='%23c5f16b'%3EVT%3C/text%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}
    html{color-scheme:dark}
    body{margin:0;background:#10151d;color:#f4f6fa;font-family:Arial,Helvetica,sans-serif;line-height:1.65}
    .page{width:min(1080px,100%);padding:0 32px;margin:auto;min-height:100svh;display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 0;border-bottom:1px solid #323944}
    .brand{font-size:20px;font-weight:700;letter-spacing:.02em}
    .label{color:#bac2cd;font-size:14px}
    main{flex:1;display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:64px;padding:80px 0}
    .eyebrow{color:#c5f16b;font-size:16px;margin:0 0 20px}
    h1{font-size:clamp(56px,8vw,100px);letter-spacing:-.045em;line-height:1.16;margin:0 0 30px;font-weight:800}
    h1 span{display:block;color:#c5f16b}
    .intro{font-size:20px;color:#bac2cd;max-width:480px;margin:0}
    .card{border:1px solid #3e4957;border-radius:24px;background:#19212c;padding:36px;transform:rotate(3deg)}
    .monogram{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#c5f16b;color:#10151d;font-size:36px;font-weight:800;margin-bottom:48px}
    h2{font-size:28px;line-height:1.3;margin:0 0 10px}
    .card p{margin:0;color:#bac2cd;font-size:16px}
    .rule{width:44px;height:3px;background:#c5f16b;margin:28px 0}
    footer{display:flex;justify-content:space-between;gap:16px;padding:24px 0;border-top:1px solid #323944;color:#bac2cd;font-size:14px}
    @media(max-width:700px){.page{padding:0 24px}header{padding:22px 0}main{grid-template-columns:1fr;gap:44px;padding:52px 0}.card{transform:none;padding:28px}.monogram{margin-bottom:28px}.intro{font-size:18px}footer{flex-wrap:wrap}}
    @media(prefers-reduced-motion:no-preference){main{animation:appear .65s ease-out}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <div class="page">
    <header><div class="brand">VT.</div><div class="label">Trang cá nhân</div></header>
    <main>
      <section aria-labelledby="welcome">
        <p class="eyebrow">Xin chào, mình là</p>
        <h1 id="welcome">Văn <span>Thắng.</span></h1>
        <p class="intro">Chào mừng bạn đến với góc nhỏ của mình trên Internet.</p>
      </section>
      <aside class="card" aria-labelledby="about">
        <div class="monogram" aria-hidden="true">VT</div>
        <h2 id="about">Một chút về mình</h2>
        <p>Mình là Văn Thắng. Đây là nơi mình giới thiệu bản thân và chia sẻ những điều muốn lưu lại.</p>
        <div class="rule" aria-hidden="true"></div>
        <p>Cảm ơn bạn đã ghé thăm!</p>
      </aside>
    </main>
    <footer><span>© Văn Thắng</span><span>Rất vui khi bạn có mặt ở đây.</span></footer>
  </div>
</body>
</html>
